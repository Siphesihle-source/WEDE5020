<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Wash enquiries | Simza's Car Wash Katlehong</title>
    <meta name="description"
      content="Contact Simza's Car Wash in Katlehong for general enquiries, feedback and service information.">

    <title>Simza's Car Wash - Enquiry</title>

    <!-- Poppins heading font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/Part 3.css">
    <!-- Font Awesome 5 icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">

            <img src="images/Simza's Company Logo.png" alt="Simza's Car Wash Logo">

            <div>
                <h1>Simza's Car Wash</h1>
                <p>Reliable and Quality Car Cleaning Services</p>
            </div>

        </div>


        <!-- Navigation -->
        <nav>

            <ul>
                <li><a href="Index.html">Home</a></li>
                <li><a href="About us.html">About Us</a></li>
                <li><a href="Service.html">Services</a></li>
                <li><a class="active" href="enquiry.html">Enquiry</a></li>
                <li><a href="Contact page.html">Contact</a></li>
            </ul>

        </nav>

    </header>


    <!-- Main content -->
    <main>

        <section class="page-heading">

            <h2>Make an Enquiry</h2>

            <p>
                Complete the form below to enquire about our services.
            </p>

        </section>


        <!-- Enquiry form -->
        <section class="form-section">

            <form id="enquiryForm">

                <label for="name">Full Name:</label>

                <input type="text" id="name" name="name" placeholder="Enter your full name" required>


                <label for="email">Email Address:</label>

                <input type="email" id="email" name="email" placeholder="Enter your email address" required>


                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" pattern="[0-9+\s()-]{10,15}" required>



             <label for="enquiryService">Choose a service:</label>

             <select id="enquiryService" name="service" required>
             <option value="">-- Select a service --</option>
             <option value="Exterior Car Wash">Exterior Car Wash - R80</option>
             <option value="Interior Cleaning">Interior Cleaning - R100</option>
             <option value="Full Car Cleaning">Full Car Cleaning - R150</option>
             </select>


                <label for="date">Preferred Date:</label>

                <input type="date" id="enquiryDate" name="date" required>

                <label for="enquiryPhone">Phone number:</label>
                <input type="tel" id="enquiryPhone" name="phone" required>


                <label for="message">Message:</label>

                <textarea id="message" name="message" rows="6" placeholder="Enter your enquiry or booking requirements"
                    required></textarea>


                <button type="submit" class="button">
                    Submit Enquiry
                </button>
                <div id="enquiryStatus" class="p3-status" role="status" aria-live="polite"></div>
            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer class="site-footer">

    <p>&copy; 2026 Simza's Car Wash. All Rights Reserved.</p>

    <p>Follow us on social media:</p>

    <div class="social-media">

        <a href="#" aria-label="Facebook">
            <i class="fab fa-facebook-f"></i>
        </a>

        <a href="#" aria-label="Instagram">
            <i class="fab fa-instagram"></i>
        </a>

        <a href="#" aria-label="TikTok">
            <i class="fab fa-tiktok"></i>
        </a>

        <a href="#" aria-label="WhatsApp">
            <i class="fab fa-whatsapp"></i>
        </a>

    </div>

</footer>

<script src="../js/Part 3.js" defer></script>

</body>

</html>
